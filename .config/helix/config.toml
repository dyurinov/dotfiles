theme = "onedark"

[editor]
markdown-reading-mode = false
line-number = "relative"
mouse = false
clipboard-provider = "tmux"
default-yank-register = "+"
completion-timeout = 50
shell = ["zsh", "-c"]

[editor.indent-guides]
render = true
skip-levels = 1

[editor.cursor-shape]
insert = "bar"
normal = "block"
select = "underline"

[editor.file-picker]
hidden = false

[keys.normal.space]
m = "markdown_reading_mode"
"." = "no_op"
E = "file_explorer_in_current_buffer_directory"
